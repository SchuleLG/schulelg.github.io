<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tafelpräsentationen · Bienenklasse</title>
<link rel="icon" href="../assets/biene.png">
<style>
  :root {
    --honig: #f6b928;
    --honig-hell: #fff4d1;
    --braun: #3b2a14;
    --tafel: #2f4a3a;
    --tafel-hell: #e7efe9;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif;
    color: var(--braun);
    background: #f7f5ef;
    line-height: 1.5;
  }
  header {
    background: var(--tafel);
    color: #fff;
    padding: 1.6rem 1.2rem 1.8rem;
  }
  .kopf {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .kopf img { width: 64px; height: auto; }
  h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.4rem); line-height: 1.2; }
  .kopf p { margin: .2rem 0 0; opacity: .85; }

  main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.2rem 3rem; }

  .kacheln {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.3rem;
  }
  .kachel {
    display: flex;
    flex-direction: column;
    background: #fff;
    border-radius: var(--radius);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 4px 0 rgba(0,0,0,.08), 0 8px 20px rgba(0,0,0,.06);
    transition: transform .15s;
  }
  a.kachel:hover { transform: translateY(-3px); }
  .bild {
    flex: 0 0 140px;
    height: 140px;
    overflow: hidden;
    background: var(--tafel);
    display: grid;
    place-items: center;
    font-size: 3.2rem;
  }
  .bild img { display: block; width: 100%; height: 140px; object-fit: cover; object-position: center top; }
  .text { padding: 1rem 1.2rem 1.2rem; flex: 1; display: flex; flex-direction: column; }
  .etikett { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--tafel); }
  .kachel h3 { margin: .2rem 0 .4rem; font-size: 1.3rem; }
  .kachel p { margin: 0; flex: 1; }
  .los {
    margin-top: 1rem; align-self: flex-start;
    padding: .4rem 1rem; border-radius: 999px;
    background: var(--tafel); color: #fff; font-weight: 700;
  }
  .kachel.bald { opacity: .55; box-shadow: none; border: 3px dashed #b9c8bd; }
  .kachel.bald .los { background: #ddd; color: #777; }

  footer { text-align: center; padding: 1rem 1rem 2.5rem; font-size: .9rem; color: #8a8273; }
</style>
</head>
<body>

<header>
  <div class="kopf">
    <img src="../assets/biene.png" alt="">
    <div>
      <h1>Tafelpräsentationen</h1>
      <p>Bienenklasse · für den Einsatz an der Tafel</p>
    </div>
  </div>
</header>

<main>
  <div class="kacheln">

    <!--
      SO SIEHT EINE FERTIGE KACHEL AUS:
      <a class="kachel" href="ordnername/">
        <div class="bild">📊</div>
        <div class="text">
          <span class="etikett">Mathe · Thema</span>
          <h3>Titel der Präsentation</h3>
          <p>Kurze Beschreibung.</p>
          <span class="los">Öffnen ▶</span>
        </div>
      </a>
    -->

    <div class="kachel bald">
      <div class="bild">🔢</div>
      <div class="text">
        <span class="etikett">Mathe</span>
        <h3>Erste Präsentation</h3>
        <p>Hier kommt bald eine Tafelpräsentation.</p>
        <span class="los">Bald da</span>
      </div>
    </div>

    <div class="kachel bald">
      <div class="bild">🔤</div>
      <div class="text">
        <span class="etikett">Deutsch</span>
        <h3>Erste Präsentation</h3>
        <p>Hier kommt bald eine Tafelpräsentation.</p>
        <span class="los">Bald da</span>
      </div>
    </div>

  </div>
</main>

<footer>Diese Seite ist nicht auf der Lernspiele-Seite verlinkt.</footer>

</body>
</html>
