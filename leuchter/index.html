:root{color-scheme:light;--honig:#f6b928;--honig-hell:#fff4d1;--honig-dunkel:#c98a00;--braun:#3b2a14;--gold:#FFD43B;--gold2:#F5B800;--gruen:#3E9B4F;--radius:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--honig-hell);color:var(--braun);font-family:Grund,ui-rounded,system-ui,sans-serif;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:var(--braun);cursor:pointer;-webkit-text-fill-color:currentColor}
.screen{display:none;min-height:100vh;flex-direction:column;align-items:center;padding:14px 16px 28px}
.screen.on{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hidden{display:none!important}

/* Kopf */
.top{width:100%;max-width:1000px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:60px}
.icon{width:60px;height:60px;border-radius:50%;border:3px solid var(--braun);background:#fff;display:grid;place-items:center;padding:0}
.icon svg{width:30px;height:30px}.icon.off{opacity:.45}
.prog{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.prog i{width:26px;height:26px;display:block;border-radius:50%;background:#fff;border:3px solid #E4D3A8}
.prog i.cur{border-color:var(--honig-dunkel)}.prog i.ok{background:var(--gold);border-color:var(--gold2)}.prog i.no{background:#E9E1CF;border-color:#CDBF9E}

/* Start */
h1{font-size:clamp(34px,6vw,60px);margin:6px 0 0;font-weight:400}
.hello{display:flex;align-items:center;gap:14px;margin:6px 0 16px;max-width:900px}
.hello svg{width:clamp(90px,14vw,140px);height:auto}
.bubble{background:#fff;border-radius:24px;padding:14px 22px;font-size:clamp(22px,3.2vw,34px);box-shadow:0 4px 0 rgba(0,0,0,.07);position:relative}
.bubble::before{content:"";position:absolute;left:-14px;top:50%;margin-top:-12px;border:12px solid transparent;border-right-color:#fff;border-left:0}
.ablink{display:inline-flex;align-items:center;gap:10px;margin-top:22px;font-size:clamp(20px,2.6vw,26px);color:var(--braun);text-decoration:none;background:#fff;border:3px dashed var(--honig-dunkel);border-radius:2em;padding:.4em 1.2em}
.ablink svg{width:30px;height:30px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;width:100%;max-width:820px}
.tile{min-height:clamp(130px,18vh,200px);justify-content:center}
.tile{background:#fff;border:none;border-radius:var(--radius);box-shadow:0 5px 0 rgba(0,0,0,.09);padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.09)}
.tile .pv{font-size:clamp(30px,5vw,46px);min-height:1.5em;display:flex;align-items:center;gap:.3em}
.tile .t{font-size:clamp(20px,3vw,28px)}
.pv .lit{background:var(--gold);border-radius:.12em;padding:0 .04em}
.pv .gap{display:inline-block;width:.6em;height:.9em;border:3px dashed var(--honig-dunkel);border-radius:.12em;vertical-align:-.1em}
.pv svg{height:1.3em;width:auto}

/* Aufgabe */
.task{font-size:clamp(20px,3vw,32px);text-align:center;min-height:2.4em;max-width:900px;margin:2px 0 8px;display:flex;align-items:center;justify-content:center}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:1000px}
.pic{width:clamp(120px,min(30vw,24vh),240px);height:clamp(120px,min(30vw,24vh),240px)}
.pic svg{width:100%;height:100%}
.go{font-size:clamp(26px,4vw,38px);padding:.35em 1.4em;border-radius:2em;border:none;background:var(--honig);color:var(--braun);margin-top:14px;box-shadow:0 4px 0 rgba(0,0,0,.18)}

/* Wort mit Bögen */
.word{display:inline-flex;font-size:clamp(60px,min(12vw,13vh),130px);line-height:1.1;margin:6px 0}
.syl{position:relative;display:inline-flex;padding:0 .04em .32em}
.syl::after{content:"";position:absolute;left:.08em;right:.08em;bottom:.04em;height:.24em;border:.055em solid var(--braun);border-top:none;border-radius:0 0 50% 50%/0 0 100% 100%;transition:.3s}
.syl.lit::after{border-color:var(--gold2)}
.ch{display:inline-block;padding:0 .02em;border-radius:.1em;transition:background .25s}
.word.tap .ch{cursor:pointer}
.ch.on{background:var(--gold)}
.ch.no{animation:wig .4s}
.ch.slot{display:inline-block;width:.62em;border:.05em dashed var(--honig-dunkel);border-radius:.1em;text-align:center;height:1em;line-height:1;align-self:center}
.ch.slot.on{border-style:solid;border-color:var(--gold2)}
@keyframes wig{25%{transform:translateX(-.06em)}75%{transform:translateX(.06em)}}

/* Verbinden */
.match{position:relative;display:flex;justify-content:space-between;align-items:stretch;width:min(96vw,860px);gap:20px}
.mcol{display:flex;flex-direction:column;gap:clamp(10px,2vh,20px);justify-content:center;z-index:2}
.mcard{background:#fff;border:4px solid #E4D3A8;border-radius:20px;display:flex;align-items:center;justify-content:center;padding:6px 14px}
.mcard.p{width:clamp(100px,min(24vw,17vh),180px);height:clamp(100px,min(24vw,17vh),180px);padding:6px}
.mcard.p svg{width:100%;height:100%}
.mcard.s{height:clamp(100px,min(24vw,17vh),180px);min-width:clamp(170px,30vw,300px)}
.mcard.sel{border-color:var(--honig-dunkel);box-shadow:0 0 0 5px var(--gold)}
.mcard.done{border-color:var(--gruen);cursor:default}
.mcard.no{animation:wig2 .4s}
@keyframes wig2{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.skel{display:inline-flex;font-size:clamp(40px,min(7vw,7vh),68px);line-height:1.1}
.skel .syl{min-width:1.35em;justify-content:center}
.skel .ch{background:var(--gold)}
svg.lines{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}

/* Leuchter-Knöpfe */
.lamps{display:flex;gap:clamp(8px,2vw,18px);flex-wrap:wrap;justify-content:center;margin-top:10px}
.lampbtn{position:relative;width:clamp(76px,13vw,112px);aspect-ratio:1;border:none;background:none;padding:0;container-type:inline-size}
.lampbtn svg{position:absolute;inset:0;width:100%;height:100%}
.lampbtn span{position:absolute;inset:0;display:grid;place-items:center;font-size:44cqw;padding-bottom:4cqw}
.lampbtn.no{animation:wig2 .4s;opacity:.45}

/* Leuchter oder nicht */
.big{font-size:clamp(120px,min(30vw,24vh),260px);line-height:1;width:1.3em;height:1.3em;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.08);transition:.3s}
.big.yes{background:var(--gold);box-shadow:0 0 60px 16px rgba(255,212,59,.6)}
.big.nope{background:#E9E1CF;color:#8b7b5c}
.yn{display:flex;gap:clamp(16px,4vw,40px);margin-top:20px;flex-wrap:wrap;justify-content:center}
.ynb{display:flex;flex-direction:column;align-items:center;gap:6px;border:4px solid #E4D3A8;border-radius:24px;background:#fff;padding:12px 20px;font-size:clamp(22px,3vw,30px);min-width:200px}
.ynb svg{width:clamp(70px,10vw,100px);height:auto}
.ynb.no{animation:wig2 .4s}

.feedback{font-size:clamp(22px,3.2vw,34px);min-height:1.5em;margin-top:4px;text-align:center}
.stars{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap;justify-content:center}
.stars svg{width:clamp(50px,9vw,84px);height:auto}
.endbtns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.go.dark{background:var(--braun);color:#fff}
</style>
</head>

<stop offset="0.6" stop-color="#FFE680" stop-opacity="0.35"/><stop offset="1" stop-color="#FFE680" stop-opacity="0"/></radialGradient></defs><rect x="95" y="12" width="10" height="20" rx="5" fill="#F5B800" transform="rotate(0 100 100)"/><rect x="95" y="12" width="10" height="20" rx="5" fill="#F5B800" transform="rotate(30 100 100)"/><rect x="95" y="12" width="10" height="20" rx="5" fill="#F5B800" transform="rotate(60 100 100)"/><rect x="95" y="12" width="10" height="20" rx="5" fill="#F5B800" transform="rotate(90 100 100)"/><rect x="95" y="12" width="10" height="20" rx="5" fill="#F5B800" transform="rotate(120 100 100)"/><rect x="95" y="12" width="10" height="20" rx="5" fill="#F5B800" transform="rotate(150 100 100)"/><rect x="95" y="12" width="10" height="20" rx="5" fill="#F5B800" transform="rotate(180 100 100)"/><rect x="95" y="12" width="10" height="20" rx="5" fill="#F5B800" transform="rotate(210 100 100)"/><rect x="95" y="12" width="10" height="20" rx="5" fill="#F5B800" transform="rotate(240 100 100)"/><rect x="95" y="12" width="10" height="20" rx="5" fill="#F5B800" transform="rotate(270 100 100)"/><rect x="95" y="12" width="10" height="20" rx="5" fill="#F5B800" transform="rotate(300 100 100)"/><rect x="95" y="12" width="10" height="20" rx="5" fill="#F5B800" transform="rotate(330 100 100)"/><circle cx="100" cy="100" r="62" fill="#FFD43B" stroke="#F5B800" stroke-width="5"/></svg>`;
const WORDS=[ // Wort, Silben, mit Bild?
 ['Sofa','So-fa'],['Oma','O-ma'],['Lama','La-ma'],['Ananas','A-na-nas'],['Nase','Na-se'],['Limo','Li-mo'],
 ['Esel','E-sel'],['Ufo','U-fo'],['Melone','Me-lo-ne'],['Insel','In-sel'],['Ofen','O-fen'],['Salami','Sa-la-mi']];
const EXTRA=[['Mama','Ma-ma'],['lila','li-la'],['Name','Na-me'],['malen','ma-len'],['lesen','le-sen'],['Lose','Lo-se'],['Mia','Mi-a'],['Emil','E-mil']];
const VOW=/[aeiouAEIOU]/;
const CONS='MLSFNmlsfn';
const STAR='<svg viewBox="0 0 100 100"><path d="M50 6l13 28 30 3-23 20 7 30-27-16-27 16 7-30L7 37l30-3z" fill="FILL" stroke="#c98a00" stroke-width="5" stroke-linejoin="round"/></svg>';
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- Vorlesen ---------- */
let voiceOn=true,deVoice=null,lastSay='';
function pickVoice(){try{const v=speechSynthesis.getVoices();deVoice=v.find(x=>/^de/i.test(x.lang)&&/premium|enhanced|natural|google/i.test(x.name))||v.find(x=>/^de/i.test(x.lang))||null;}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function say(t){if(!voiceOn||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';if(deVoice)u.voice=deVoice;u.rate=.9;speechSynthesis.speak(u);}catch(e){}}
const spk=document.getElementById('spk');
spk.onclick=()=>{voiceOn=!voiceOn;spk.classList.toggle('off',!voiceOn);if(voiceOn)say(lastSay);else try{speechSynthesis.cancel()}catch(e){}};
function setTask(t,speech){document.getElementById('task').textContent=t;lastSay=speech||t;say(lastSay);}

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);}

/* ---------- Bausteine ---------- */
function picEl(w){const d=document.createElement('div');d.className='pic';d.innerHTML=PICS[w]||'';d.onclick=()=>say(w);return d;}
function wordEl(syls,opts={}){
  const el=document.createElement('div');el.className='word'+(opts.tap?' tap':'');
  let pos=0;
  syls.split('-').forEach(sy=>{
    const s=document.createElement('span');s.className='syl';
    [...sy].forEach(c=>{
      const ch=document.createElement('span');
      if(opts.gap===pos){ch.className='ch slot';ch.dataset.want=c;ch.innerHTML='&nbsp;';}
      else{ch.className='ch'+(VOW.test(c)?' v':'');ch.textContent=c;}
      pos++;s.appendChild(ch);
    });
    el.appendChild(s);
  });
  return el;
}

/* ---------- Ablauf ---------- */
let ex=null,N=5,ti=0,results=[],pool=[];
const stage=document.getElementById('stage'),fb=document.getElementById('fb'),nextBtn=document.getElementById('nextBtn'),prog=document.getElementById('prog');
document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>start(t.dataset.ex));
document.getElementById('home').onclick=()=>{try{speechSynthesis.cancel()}catch(e){};show('sStart');};
document.getElementById('again').onclick=()=>start(ex);
document.getElementById('other').onclick=()=>{show('sStart');say('Was möchtest du üben?');};
function start(e){
  ex=e;N=e==='yn'?10:5;ti=0;results=[];
  pool=shuffle(e==='tap'?WORDS.concat(EXTRA):WORDS);
  prog.innerHTML='';for(let i=0;i<N;i++)prog.appendChild(document.createElement('i'));
  show('sGame');next();
}
function next(){
  [...prog.children].forEach((p,k)=>p.classList.toggle('cur',k===ti));
  stage.innerHTML='';fb.textContent='';nextBtn.classList.add('hidden');
  ({tap:exTap,match:exMatch,gap:exGap,yn:exYN})[ex]();
}
function done(ok,text){
  const p=prog.children[ti];p.classList.remove('cur');p.classList.add(ok?'ok':'no');
  results.push(ok);fb.textContent=text;say(text);
  nextBtn.classList.remove('hidden');
}
nextBtn.onclick=()=>{ti++;if(ti<N)next();else finish();};
function finish(){
  const s=results.filter(Boolean).length;
  document.getElementById('stars').innerHTML=results.map(r=>STAR.replace('FILL',r?'#f6b928':'#efe6d0')).join('');
  const t='Du hast '+(s===1?'einen Stern':s+' Sterne')+'.';
  document.getElementById('endText').textContent=t;show('sEnd');say('Geschafft! '+t);
}
function anzahl(n){return['keinen','einen','zwei','drei','vier'][n]||n;}

/* ---------- 1 Leuchter finden ---------- */
function exTap(){
  const [w,syls]=pool[ti%pool.length];
  setTask('Tippe alle Leuchter an.','Tippe alle Leuchter an. '+w+'.');
  if(PICS[w])stage.appendChild(picEl(w));
  const el=wordEl(syls,{tap:true});stage.appendChild(el);
  const need=el.querySelectorAll('.ch.v').length;let found=0,miss=0;
  el.querySelectorAll('.ch').forEach(ch=>ch.onclick=()=>{
    if(found===need)return;
    if(ch.classList.contains('v')){
      if(ch.classList.contains('on'))return;
      ch.classList.add('on');ch.parentElement.classList.add('lit');found++;
      if(found===need)done(miss===0,'Super! '+w+' hat '+anzahl(need)+' Leuchter.');
    }else{miss++;ch.classList.remove('no');void ch.offsetWidth;ch.classList.add('no');fb.textContent='Das ist kein Leuchter.';}
  });
}

/* ---------- 2 Verbinden ---------- */
function pattern(syls){return syls.split('-').map(s=>[...s].filter(c=>VOW.test(c)).join('')).join('-');}
function exMatch(){
  setTask('Verbinde jedes Bild mit seinen Leuchtern.','Verbinde jedes Bild mit seinen Leuchtern. Tippe zuerst ein Bild an.');
  // drei Wörter mit verschiedenen Leuchter-Mustern
  const pick=[];const seen=new Set();
  for(const w of shuffle(WORDS)){const p=pattern(w[1]).toLowerCase();if(!seen.has(p)){seen.add(p);pick.push(w);}if(pick.length===3)break;}
  const wrap=document.createElement('div');wrap.className='match';
  const L=document.createElement('div');L.className='mcol';const R=document.createElement('div');R.className='mcol';
  const lines=document.createElementNS('http://www.w3.org/2000/svg','svg');lines.setAttribute('class','lines');
  wrap.append(L,lines,R);stage.appendChild(wrap);
  let sel=null,miss=0,ok=0;const pairs=[];
  function drawLines(){
    const br=wrap.getBoundingClientRect();lines.innerHTML='';
    pairs.forEach(([a,b])=>{const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
      const l=document.createElementNS('http://www.w3.org/2000/svg','line');
      l.setAttribute('x1',ra.right-br.left);l.setAttribute('y1',ra.top+ra.height/2-br.top);
      l.setAttribute('x2',rb.left-br.left);l.setAttribute('y2',rb.top+rb.height/2-br.top);
      l.setAttribute('stroke','#F5B800');l.setAttribute('stroke-width','8');l.setAttribute('stroke-linecap','round');lines.appendChild(l);});
  }
  window.onresize=drawLines;
  function tryPair(a,b){ // a = Bild, b = Leuchter-Karte
    if(a.dataset.w===b.dataset.w){
      [a,b].forEach(x=>{x.classList.remove('sel');x.classList.add('done');});pairs.push([a,b]);drawLines();ok++;sel=null;
      if(ok===3)done(miss===0,miss===0?'Super! Alles richtig verbunden.':'Geschafft! Alles ist verbunden.');
    }else{miss++;[a,b].forEach(x=>{x.classList.remove('no','sel');void x.offsetWidth;x.classList.add('no');});sel=null;fb.textContent='Schau noch einmal genau.';}
  }
  function click(card){
    if(card.classList.contains('done'))return;
    if(card.classList.contains('p'))say(card.dataset.w);
    if(!sel){sel=card;card.classList.add('sel');return;}
    if(sel===card){card.classList.remove('sel');sel=null;return;}
    const isP=c=>c.classList.contains('p');
    if(isP(sel)===isP(card)){sel.classList.remove('sel');sel=card;card.classList.add('sel');return;}
    isP(sel)?tryPair(sel,card):tryPair(card,sel);
  }
  shuffle(pick).forEach(([w])=>{const c=document.createElement('button');c.className='mcard p';c.dataset.w=w;c.innerHTML=PICS[w];c.onclick=()=>click(c);L.appendChild(c);});
  shuffle(pick).forEach(([w,syls])=>{
    const c=document.createElement('button');c.className='mcard s';c.dataset.w=w;
    const sk=document.createElement('div');sk.className='skel';
    pattern(syls).split('-').forEach(v=>{const s=document.createElement('span');s.className='syl lit';
      [...v].forEach(x=>{const ch=document.createElement('span');ch.className='ch';ch.textContent=x;s.appendChild(ch);});sk.appendChild(s);});
    c.appendChild(sk);c.onclick=()=>click(c);R.appendChild(c);
  });
}

/* ---------- 3 Welcher Leuchter fehlt? ---------- */
function exGap(){
  const [w,syls]=pool[ti%pool.length];
  const letters=[...syls.replace(/-/g,'')];
  const vpos=letters.map((c,i)=>VOW.test(c)?i:-1).filter(i=>i>=0);
  const gap=rnd(vpos);const want=letters[gap];
  setTask('Welcher Leuchter fehlt?','Welcher Leuchter fehlt? '+w+'.');
  stage.appendChild(picEl(w));
  const el=wordEl(syls,{gap});stage.appendChild(el);
  const slot=el.querySelector('.slot');
  const row=document.createElement('div');row.className='lamps';stage.appendChild(row);
  let miss=0,fin=false;
  const big=gap===0;
  'aeiou'.split('').forEach(v=>{
    const b=document.createElement('button');b.className='lampbtn';
    const shown=big?v.toUpperCase():v;
    b.innerHTML=LAMP+'<span>'+shown+'</span>';
    b.onclick=()=>{
      if(fin)return;
      if(shown===want){fin=true;slot.textContent=want;slot.className='ch v on';slot.parentElement.classList.add('lit');
        done(miss===0,'Richtig! '+w+'.');}
      else{miss++;b.classList.remove('no');void b.offsetWidth;b.classList.add('no');fb.textContent='Sprich das Wort langsam. Welcher Leuchter passt?';}
    };
    row.appendChild(b);
  });
}

/* ---------- 4 Leuchter oder nicht? ---------- */
let lastLetter='';
function exYN(){
  let c;do{c=Math.random()<.5?rnd('aeiouAEIOU'):rnd(CONS);}while(c===lastLetter);lastLetter=c;
  setTask('Ist das ein Leuchter?');
  const big=document.createElement('div');big.className='big';big.textContent=c;stage.appendChild(big);
  const yn=document.createElement('div');yn.className='yn';stage.appendChild(yn);
  const isV=VOW.test(c);let fin=false,miss=0;
  [[true,LAMP,'Leuchter'],[false,LAMP_OFF,'kein Leuchter']].forEach(([val,ic,t])=>{
    const b=document.createElement('button');b.className='ynb';b.innerHTML=ic+'<span>'+t+'</span>';
    b.onclick=()=>{
      if(fin)return;
      if(val===isV){fin=true;big.classList.add(isV?'yes':'nope');
        done(miss===0,isV?'Richtig! '+c+' ist ein Leuchter.':'Richtig! '+c+' ist kein Leuchter.');}
      else{miss++;b.classList.remove('no');void b.offsetWidth;b.classList.add('no');fb.textContent='Schau noch einmal genau.';}
    };
    yn.appendChild(b);
  });
}
const LAMP_OFF=`<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" ><defs><radialGradient id="glow"><stop offset="0" stop-color="#FFE680" stop-opacity="0.9"/>
<stop offset="0.6" stop-color="#FFE680" stop-opacity="0.35"/><stop offset="1" stop-color="#FFE680" stop-opacity="0"/></radialGradient></defs><rect x="95" y="12" width="10" height="20" rx="5" fill="#B9AE97" transform="rotate(0 100 100)"/><rect x="95" y="12" width="10" height="20" rx="5" fill="#B9AE97" transform="rotate(30 100 100)"/><rect x="95" y="12" width="10" height="20" rx="5" fill="#B9AE97" transform="rotate(60 100 100)"/><rect x="95" y="12" width="10" height="20" rx="5" fill="#B9AE97" transform="rotate(90 100 100)"/><rect x="95" y="12" width="10" height="20" rx="5" fill="#B9AE97" transform="rotate(120 100 100)"/><rect x="95" y="12" width="10" height="20" rx="5" fill="#B9AE97" transform="rotate(150 100 100)"/><rect x="95" y="12" width="10" height="20" rx="5" fill="#B9AE97" transform="rotate(180 100 100)"/><rect x="95" y="12" width="10" height="20" rx="5" fill="#B9AE97" transform="rotate(210 100 100)"/><rect x="95" y="12" width="10" height="20" rx="5" fill="#B9AE97" transform="rotate(240 100 100)"/><rect x="95" y="12" width="10" height="20" rx="5" fill="#B9AE97" transform="rotate(270 100 100)"/><rect x="95" y="12" width="10" height="20" rx="5" fill="#B9AE97" transform="rotate(300 100 100)"/><rect x="95" y="12" width="10" height="20" rx="5" fill="#B9AE97" transform="rotate(330 100 100)"/><circle cx="100" cy="100" r="62" fill="#E4DCCB" stroke="#B9AE97" stroke-width="5"/></svg>`;
</script>
